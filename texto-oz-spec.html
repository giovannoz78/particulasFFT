<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Voz → Plexus</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas.p5Canvas{position:fixed;inset:0;display:block}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
</head>
<body>
<script>
const LANG      = "es-ES";
const STEP      = 6;
const MAX_PARTS = 1200;
const MAX_LINKS = 10;
const LINK_DIST = 70;
const LINK_SKIP = 1;

let recog, listening = false, texto = "DI UNA PALABRA";
let parts = [], pg;
let audioCtx, analyser, freqData;
let specBuf, specCtx2d, specHead = 0, specColumn = null;

const ruler = document.createElement('canvas').getContext('2d');

function calcTextSize(t) {
  let sz = 180;
  ruler.font = `bold ${sz}px sans-serif`;
  while (ruler.measureText(t).width > windowWidth * 0.90 && sz > 16) {
    sz -= 4;
    ruler.font = `bold ${sz}px sans-serif`;
  }
  return sz;
}

function setup() {
  createCanvas(windowWidth, windowHeight).addClass('p5Canvas');
  pixelDensity(1);
  pg = createGraphics(width, height);
  pg.pixelDensity(1);

  specBuf = document.createElement('canvas');
  specBuf.width  = width;
  specBuf.height = height;
  specCtx2d = specBuf.getContext('2d');
  specCtx2d.fillStyle = '#000';
  specCtx2d.fillRect(0, 0, width, height);

  background(0);
  renderText(texto);
  initSpeech();
  try { startMic(); } catch(_) {}
  window.addEventListener('pointerdown', () => startMic(), { once: true });
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  pg = createGraphics(width, height);
  pg.pixelDensity(1);
  specBuf.width  = width;
  specBuf.height = height;
  specCtx2d.fillStyle = '#000';
  specCtx2d.fillRect(0, 0, width, height);
  specHead = 0;
  renderText(texto);
}

function initSpeech() {
  const SR = window.webkitSpeechRecognition || window.SpeechRecognition;
  if (!SR) return;
  recog = new SR();
  recog.lang = LANG;
  recog.interimResults = false;
  recog.continuous = true;
  recog.onresult = e => {
    const r = e.results[e.resultIndex];
    if (!r || !r[0]) return;
    const t = r[0].transcript.trim();
    if (!t) return;
    texto = t.toUpperCase();
    renderText(texto);
  };
  recog.onend = () => { if (listening) { try { recog.start(); } catch(_) {} } };
}

function startMic() {
  if (recog && !listening) { recog.start(); listening = true; }
  if (!audioCtx) {
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(stream => {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.8;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        audioCtx.createMediaStreamSource(stream).connect(analyser);
      }).catch(() => {});
  }
}

// Construye máscaras por carácter y asigna charId a cada partícula
function renderText(t) {
  const sz = calcTextSize(t);
  const nChars = t.length;

  // Medir ancho total para calcular startX de cada carácter
  pg.textSize(sz);
  pg.textStyle(BOLD);
  const totalW = pg.textWidth(t);
  const startX = width / 2 - totalW / 2;

  // Construir máscara por carácter
  const charMasks = [];
  let cursorX = startX;
  for (let ci = 0; ci < nChars; ci++) {
    const ch = t[ci];
    const cw = pg.textWidth(ch);
    const cx = cursorX + cw / 2;

    const g = createGraphics(width, height);
    g.pixelDensity(1);
    g.background(255);
    g.fill(0); g.noStroke();
    g.textAlign(CENTER, CENTER);
    g.textStyle(BOLD);
    g.textSize(sz);
    g.text(ch, cx, height / 2);
    g.loadPixels();
    charMasks.push(g.pixels);
    g.remove();

    cursorX += cw;
  }

  // Recolectar targets con charId
  const targets = [];
  for (let y = 0; y < height; y += STEP) {
    for (let x = 0; x < width; x += STEP) {
      const idx = 4 * (y * width + x);
      for (let ci = 0; ci < nChars; ci++) {
        if (charMasks[ci][idx + 3] > 128 && charMasks[ci][idx] < 128) {
          targets.push({ x, y, charId: ci });
          break;
        }
      }
    }
  }

  const total = min(MAX_PARTS, targets.length);
  while (parts.length < total) parts.push(newPart(random(width), random(height)));
  if (parts.length > total) parts.length = total;

  // shuffle targets
  for (let i = targets.length - 1; i > 0; i--) {
    const j = floor(random(i + 1));
    [targets[i], targets[j]] = [targets[j], targets[i]];
  }

  for (let i = 0; i < parts.length; i++) {
    parts[i].target = createVector(targets[i].x, targets[i].y);
    parts[i].charId = targets[i].charId;
  }
}

function newPart(x, y) {
  return {
    pos:      createVector(x, y),
    vel:      p5.Vector.random2D().mult(random(2)),
    acc:      createVector(0, 0),
    target:   createVector(x, y),
    maxSpeed: 8,
    maxForce: 0.6,
    r:        1.8 + random(1.2),
    charId:   0,
    cr: 255, cg: 255, cb: 255
  };
}

// Espectrograma — escribe en buffer invisible y lee columna actual
function updateSpectrogram() {
  if (!analyser) return;
  analyser.getByteFrequencyData(freqData);
  const bins = freqData.length;
  const x = specHead;
  specCtx2d.fillStyle = '#000';
  specCtx2d.fillRect(x, 0, 2, height);
  for (let i = 0; i < bins; i++) {
    const v = freqData[i] / 255;
    if (v < 0.01) continue;
    const freq_t = i / bins;
    const y      = height - freq_t * height;
    const h      = (height / bins) + 1;
    const hue    = 35 + freq_t * 150;
    specCtx2d.fillStyle = `hsl(${hue},90%,${10 + v * 68}%)`;
    specCtx2d.fillRect(x, y, 2, h);
  }
  specHead = (specHead + 2) % width;
  const col = (specHead - 2 + width) % width;
  specColumn = specCtx2d.getImageData(col, 0, 1, height).data;
}

function colorAt(py) {
  if (!specColumn) return null;
  const y   = Math.max(0, Math.min(height - 1, Math.floor(py)));
  const i   = y * 4;
  const r   = specColumn[i], g = specColumn[i+1], b = specColumn[i+2];
  if (r + g + b < 12) return null;
  return [r, g, b];
}

function draw() {
  background(0, 40);

  // Espectrograma visible de fondo
  updateSpectrogram();
  const x0 = specHead;
  drawingContext.drawImage(specBuf, x0, 0, width - x0, height, 0, 0, width - x0, height);
  if (x0 > 0) drawingContext.drawImage(specBuf, 0, 0, x0, height, width - x0, 0, x0, height);

  const tt = millis() * 0.0004;
  noFill();

  // ── Primero mover todas las partículas y actualizar color ──
  for (const p of parts) {
    const desired = p5.Vector.sub(p.target, p.pos);
    const d = desired.mag();
    desired.setMag(d < 60 ? map(d, 0, 60, 0, p.maxSpeed) : p.maxSpeed);
    const steer = p5.Vector.sub(desired, p.vel).limit(p.maxForce);
    const n     = noise(p.pos.x * 0.005, p.pos.y * 0.005, tt);
    const flow  = p5.Vector.fromAngle(map(n, 0, 1, -PI, PI)).mult(0.15);
    p.acc.set(0, 0);
    p.acc.add(steer).add(flow);
    p.vel.add(p.acc).limit(p.maxSpeed);
    p.pos.add(p.vel);

    const col = colorAt(p.pos.y);
    const lf  = 0.06;
    if (col) {
      p.cr = lerp(p.cr, col[0], lf);
      p.cg = lerp(p.cg, col[1], lf);
      p.cb = lerp(p.cb, col[2], lf);
    } else {
      p.cr = lerp(p.cr, 220, lf * 0.3);
      p.cg = lerp(p.cg, 220, lf * 0.3);
      p.cb = lerp(p.cb, 220, lf * 0.3);
    }
  }

  // ── Líneas plexus entre partículas de distintas letras ──
  const maxD2 = LINK_DIST * LINK_DIST;
  for (let i = 0; i < parts.length; i += LINK_SKIP) {
    const a = parts[i];
    let links = 0;
    for (let j = i + 1; j < parts.length; j += LINK_SKIP) {
      if (links >= MAX_LINKS) break;
      const b = parts[j];
      if (b.charId === a.charId) continue;
      const dx = a.pos.x - b.pos.x;
      const dy = a.pos.y - b.pos.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < maxD2) {
        const dist = sqrt(d2);
        const alpha = map(dist, 0, LINK_DIST, 90, 0);
        // color promedio de las dos partículas
        const lr = (a.cr + b.cr) / 2;
        const lg = (a.cg + b.cg) / 2;
        const lb = (a.cb + b.cb) / 2;
        stroke(lr, lg, lb, alpha);
        line(a.pos.x, a.pos.y, b.pos.x, b.pos.y);
        links++;
      }
    }
  }

  // ── Dibujar partículas ──
  noStroke();
  for (const p of parts) {
    const d     = p5.Vector.dist(p.pos, p.target);
    const alpha = constrain(map(d, 0, 120, 255, 40), 40, 255);
    fill(p.cr, p.cg, p.cb, alpha);
    circle(p.pos.x, p.pos.y, p.r);
  }
}
</script>
</body>
</html>
